<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
  <title id="title">오늘의집 클론 프로젝트 역할 분담</title>
  <desc id="desc">팀원별 담당 영역과 주요 구현 기능을 정리한 역할 분담 표</desc>
  <defs>
    <style>
      .title{font:800 40px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#111827}
      .sub{font:400 17px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#64748b}
      .th{font:700 17px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#fff}
      .name{font:750 19px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#111827}
      .area{font:700 17px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#111827}
      .body{font:400 16px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#374151}
      .note{font:600 15px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#0877cf}
    </style>
  </defs>

  <rect width="1400" height="880" fill="#ffffff"/>
  <rect x="60" y="50" width="10" height="90" fill="#1496f4"/>
  <text x="96" y="94" class="title">역할 분담</text>
  <text x="96" y="127" class="sub">기능별로 화면 구현부터 서버 처리 및 데이터베이스 연동까지 담당</text>

  <!-- 표 머리글 -->
  <rect x="70" y="180" width="1260" height="64" fill="#0877cf"/>
  <text x="105" y="220" class="th">팀원</text>
  <text x="300" y="220" class="th">담당 기능 및 주요 구현 내용</text>

  <!-- 다른 팀원: 이름만 작성 -->
  <rect x="70" y="244" width="1260" height="70" fill="#f5f5f5"/><text x="105" y="287" class="name">문규리</text>
  <rect x="70" y="314" width="1260" height="70" fill="#ffffff"/><text x="105" y="357" class="name">조지훈</text>
  <rect x="70" y="384" width="1260" height="70" fill="#f5f5f5"/><text x="105" y="427" class="name">류호훈</text>
  <rect x="70" y="454" width="1260" height="70" fill="#ffffff"/><text x="105" y="497" class="name">안정빈</text>

  <!-- 장미성 담당 영역 -->
  <rect x="70" y="524" width="1260" height="300" fill="#f5f5f5"/>
  <text x="105" y="570" class="name">장미성</text>

  <text x="300" y="558" class="area">• 회원·판매자 인증/가입 기능</text>
  <text x="330" y="590" class="body">
    <tspan x="330" dy="0">일반 회원·판매자 회원가입</tspan>
    <tspan x="330" dy="27">로그인·로그아웃</tspan>
    <tspan x="330" dy="27">비밀번호 변경</tspan>
    <tspan x="330" dy="27">판매자 가입 신청 및 승인 대기 화면</tspan>
  </text>

  <text x="300" y="710" class="area">• 베스트</text>
  <text x="330" y="740" class="body">쇼핑 카테고리 베스트 상품</text>

  <text x="300" y="776" class="area">• 단독 상품</text>
  <text x="330" y="806" class="body">쇼핑 카테고리 단독 상품</text>

  <!-- 열 구분선 -->
  <line x1="255" y1="180" x2="255" y2="824" stroke="#d9dde3"/>
  <rect x="70" y="824" width="1260" height="5" fill="#1496f4"/>
</svg>
