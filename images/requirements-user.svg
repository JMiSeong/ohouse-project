<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">일반 사용자 요구사항 명세</title><desc id="desc">일반 사용자와 구매자의 주요 요구사항을 정리한 표</desc>
  <defs><style>.title{font:800 40px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#111827}.sub{font:400 17px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#64748b}.th{font:700 17px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#fff}.id{font:700 16px Arial,sans-serif;fill:#0877cf}.cat{font:700 17px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#111827}.body{font:400 17px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#374151}</style></defs>
  <rect width="1400" height="820" fill="#fff"/><rect x="60" y="50" width="10" height="90" fill="#1496f4"/><text x="96" y="94" class="title">일반 사용자 요구사항</text><text x="96" y="127" class="sub">회원 및 구매자가 서비스를 이용하기 위해 필요한 기능</text>
  <rect x="70" y="180" width="1260" height="62" fill="#0877cf"/><text x="105" y="219" class="th">구분</text><text x="360" y="219" class="th">요구사항</text>
  <g><rect x="70" y="242" width="1260" height="62" fill="#f5f5f5"/><text x="105" y="281" class="cat">회원</text><text x="360" y="281" class="body">사용자는 회원가입, 로그인 및 로그아웃을 할 수 있다.</text></g>
  <g><rect x="70" y="304" width="1260" height="62" fill="#fff"/><text x="105" y="343" class="cat">상품 탐색</text><text x="360" y="343" class="body">사용자는 쇼핑 홈과 상품 목록을 통해 다양한 상품을 탐색하고 조회할 수 있다.</text></g>
  <g><rect x="70" y="366" width="1260" height="62" fill="#f5f5f5"/><text x="105" y="405" class="cat">검색</text><text x="360" y="405" class="body">사용자는 검색어와 조건을 이용해 원하는 상품을 찾을 수 있다.</text></g>
  <g><rect x="70" y="428" width="1260" height="62" fill="#fff"/><text x="105" y="467" class="cat">상품 상세</text><text x="360" y="467" class="body">사용자는 상품 정보, 이미지, 가격 및 옵션을 확인할 수 있다.</text></g>
  <g><rect x="70" y="490" width="1260" height="62" fill="#f5f5f5"/><text x="105" y="529" class="cat">장바구니</text><text x="360" y="529" class="body">사용자는 상품 옵션과 수량을 선택해 장바구니에 담고 변경·삭제할 수 있다.</text></g>
  <g><rect x="70" y="552" width="1260" height="62" fill="#fff"/><text x="105" y="591" class="cat">주문·결제</text><text x="360" y="591" class="body">사용자는 배송 정보를 입력하고 선택한 상품을 주문·결제할 수 있다.</text></g>
  <g><rect x="70" y="614" width="1260" height="62" fill="#f5f5f5"/><text x="105" y="653" class="cat">주문 상태</text><text x="360" y="653" class="body">사용자는 주문 내역과 결제·배송 진행 상태를 확인할 수 있다.</text></g>
  <g><rect x="70" y="676" width="1260" height="62" fill="#fff"/><text x="105" y="715" class="cat">리뷰</text><text x="360" y="715" class="body">구매한 사용자는 상품 리뷰를 등록·수정·삭제할 수 있다.</text></g>
  <line x1="320" y1="180" x2="320" y2="738" stroke="#d9dde3"/><rect x="70" y="738" width="1260" height="5" fill="#1496f4"/>
</svg>
