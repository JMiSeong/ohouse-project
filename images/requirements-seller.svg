<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">판매자 요구사항 명세</title><desc id="desc">판매자의 주요 요구사항을 정리한 표</desc>
  <defs><style>.title{font:800 40px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#111827}.sub{font:400 17px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#64748b}.th{font:700 17px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#fff}.id{font:700 16px Arial,sans-serif;fill:#0877cf}.cat{font:700 17px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#111827}.body{font:400 17px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#374151}</style></defs>
  <rect width="1400" height="820" fill="#fff"/><rect x="60" y="50" width="10" height="90" fill="#1496f4"/><text x="96" y="94" class="title">판매자 요구사항</text><text x="96" y="127" class="sub">입점 신청부터 상품·주문·정산 정보를 관리하기 위해 필요한 기능</text>
  <rect x="70" y="190" width="1260" height="68" fill="#0877cf"/><text x="105" y="233" class="th">구분</text><text x="360" y="233" class="th">요구사항</text>
  <g><rect x="70" y="258" width="1260" height="72" fill="#f5f5f5"/><text x="105" y="302" class="cat">판매자 가입</text><text x="360" y="302" class="body">사용자는 판매자 정보와 사업 정보를 입력해 판매자 가입을 신청할 수 있다.</text></g>
  <g><rect x="70" y="330" width="1260" height="72" fill="#fff"/><text x="105" y="374" class="cat">승인 상태</text><text x="360" y="374" class="body">판매자는 가입 신청의 승인·대기·반려 상태를 확인할 수 있다.</text></g>
  <g><rect x="70" y="402" width="1260" height="72" fill="#f5f5f5"/><text x="105" y="446" class="cat">상품 관리</text><text x="360" y="446" class="body">승인된 판매자는 상품을 등록·조회·수정·삭제할 수 있다.</text></g>
  <g><rect x="70" y="474" width="1260" height="72" fill="#fff"/><text x="105" y="518" class="cat">상품 옵션</text><text x="360" y="518" class="body">판매자는 상품 이미지, 가격 및 선택 옵션을 등록하고 관리할 수 있다.</text></g>
  <g><rect x="70" y="546" width="1260" height="72" fill="#f5f5f5"/><text x="105" y="590" class="cat">주문 관리</text><text x="360" y="590" class="body">판매자는 주문 내역을 조회하고 주문 처리 상태를 변경할 수 있다.</text></g>
  <g><rect x="70" y="618" width="1260" height="72" fill="#fff"/><text x="105" y="662" class="cat">매출·정산</text><text x="360" y="662" class="body">판매자는 판매 내역과 정산 금액 및 처리 상태를 확인할 수 있다.</text></g>
  <line x1="320" y1="190" x2="320" y2="690" stroke="#d9dde3"/><rect x="70" y="690" width="1260" height="5" fill="#1496f4"/>
</svg>
