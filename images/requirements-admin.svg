<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">관리자 요구사항 명세</title><desc id="desc">관리자의 주요 요구사항을 정리한 표</desc>
  <defs><style>.title{font:800 40px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#111827}.sub{font:400 17px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#64748b}.th{font:700 17px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#fff}.id{font:700 16px Arial,sans-serif;fill:#0877cf}.cat{font:700 17px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#111827}.body{font:400 17px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#374151}</style></defs>
  <rect width="1400" height="820" fill="#fff"/><rect x="60" y="50" width="10" height="90" fill="#1496f4"/><text x="96" y="94" class="title">관리자 요구사항</text><text x="96" y="127" class="sub">서비스 운영과 판매자 승인 및 정산 처리를 위해 필요한 기능</text>
  <rect x="70" y="190" width="1260" height="68" fill="#0877cf"/><text x="105" y="233" class="th">구분</text><text x="360" y="233" class="th">요구사항</text>
  <g><rect x="70" y="258" width="1260" height="72" fill="#f5f5f5"/><text x="105" y="302" class="cat">관리자 인증</text><text x="360" y="302" class="body">관리자는 관리자 계정으로 로그인하여 관리 기능에 접근할 수 있다.</text></g>
  <g><rect x="70" y="330" width="1260" height="72" fill="#fff"/><text x="105" y="374" class="cat">판매자 승인</text><text x="360" y="374" class="body">관리자는 판매자 가입 신청 정보를 검토하고 승인 또는 반려할 수 있다.</text></g>
  <g><rect x="70" y="402" width="1260" height="72" fill="#f5f5f5"/><text x="105" y="446" class="cat">회원 관리</text><text x="360" y="446" class="body">관리자는 일반 회원과 판매자 계정 및 활동 상태를 조회·관리할 수 있다.</text></g>
  <g><rect x="70" y="474" width="1260" height="72" fill="#fff"/><text x="105" y="518" class="cat">운영 관리</text><text x="360" y="518" class="body">관리자는 등록 상품과 주문 처리 현황을 조회하고 운영 상태를 확인할 수 있다.</text></g>
  <g><rect x="70" y="546" width="1260" height="72" fill="#f5f5f5"/><text x="105" y="590" class="cat">정산 확인</text><text x="360" y="590" class="body">관리자는 판매자별 판매 내역과 정산 대상 금액을 확인할 수 있다.</text></g>
  <g><rect x="70" y="618" width="1260" height="72" fill="#fff"/><text x="105" y="662" class="cat">정산 처리</text><text x="360" y="662" class="body">관리자는 판매자 정산을 처리하고 정산 완료 상태로 변경할 수 있다.</text></g>
  <line x1="320" y1="190" x2="320" y2="690" stroke="#d9dde3"/><rect x="70" y="690" width="1260" height="5" fill="#1496f4"/>
</svg>
